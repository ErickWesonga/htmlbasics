<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="static/css/register.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
</head>
<body>
    <div class="container">
        <div class="logo">Pixel</div>
        <h1>Create Account</h1>
        <p class="Subtitle">Please fill in the form below</p>
        <form action="">
            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your fullname" required>
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label for="password">Enter your Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="input-group">
                <label for="confirm password">Confirm Password</label>
                <input type="password" id="confirm password" name="confirm password" placeholder="Confirm your password" required>

            </div>
            <div class="terms">
               <!-- <label for="">-->
                    <input type="checkbox" name="terms" required>
                    <label for="terms"> I agree to the <a href="https://unstats.un.org/unsd/business-stat/SBR/Documents/UN_Guidelines_on_SBR.pdf">Terms and conditions</a></label>
                    
                <!--</label> -->
            </div>
            <button type="submit">Create Account</button>
        </form>
        <p class="login">Already have an Account? <a href="login.html">Login in</a></p>
    </div>
    
</body>
</html>
